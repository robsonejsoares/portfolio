<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo escuro com cantos arredondados -->
  <rect width="32" height="32" rx="8" fill="#09090b"/>
  
  <!-- Definir o gradiente do botão (ciano para roxo) -->
  <defs>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" /> <!-- Ciano -->
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" /> <!-- Roxo -->
    </linearGradient>
  </defs>
  
  <!-- Símbolo de código estilizado (</>) com o gradiente aplicado ao traço -->
  <path d="M10 10L4 16L10 22M22 10L28 16L22 22M18 7L14 25" 
        stroke="url(#btnGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
