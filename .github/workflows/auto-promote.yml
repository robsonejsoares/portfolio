
name: Auto Promote Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  develop-to-main:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Create promotion PR and enable automatic merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          PR_URL="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head develop \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head develop \
              --title "chore(release): promover develop para main" \
              --body "Pull request criada automaticamente após atualização de develop.")"
          fi

          gh pr merge "$PR_URL" --auto --squash
